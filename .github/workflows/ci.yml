name: CI

# Runs the pre-commit gate on every pull request. Dependabot bumps touch
# package.json / package-lock.json and nothing else, but they still deserve a
# build before merge — the Deploy workflow only runs on push to main, so
# without this job PRs land with zero checks.
#
# Deliberately no GITHUB_TOKEN anywhere: the site must build with
# `npm run build` and nothing else (AGENTS.md § Stack), falling back to the
# committed pinned-repo snapshot when the API is unreachable.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Verify
        run: npm run verify
